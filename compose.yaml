version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aguafix_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: tu_usuario_de_dockerhub/aguafix-api:latest  # <-- ¡CAMBIA ESTO POR TU USUARIO!
    container_name: aguafix_api
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - db
    env_file:
      - .env

volumes:
  postgres_data: