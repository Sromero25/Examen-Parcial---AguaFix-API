name: Build, Test, Publish and Deploy AguaFix API

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aguafix-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

  publish:
    name: Publish Docker image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}
      image_reference: sromero25/aguafix-api@${{ steps.build-image.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            sromero25/aguafix-api:latest
            sromero25/aguafix-api:sha-${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: aguafix-api-production-deploy
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      IMAGE_REFERENCE: ${{ needs.publish.outputs.image_reference }}
    steps:
      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/aguafix-deploy"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/aguafix-deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy published digest through the forced SSH command
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_REFERENCE" =~ ^sromero25/aguafix-api@sha256:[a-f0-9]{64}$ ]]

          ssh \
            -i "$HOME/.ssh/aguafix-deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "aguafix-deploy@$EC2_HOST" \
            sudo -n /usr/local/sbin/aguafix-deploy "$IMAGE_REFERENCE"

      - name: Verify public root endpoint from the runner
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 5 http://aguafix-eq1.ddns.net/; then
              exit 0
            fi
            sleep 5
          done
          echo 'AguaFix API root endpoint did not respond successfully after deployment.' >&2
          exit 1
