version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aguafix_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_contraseña_aqui
      POSTGRES_DB: aguafix_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: